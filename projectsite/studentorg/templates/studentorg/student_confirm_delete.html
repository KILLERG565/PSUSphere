{% extends 'studentorg/base.html' %}
{% block title %}Delete — PSUSphere{% endblock %}
{% block page_title %}Confirm Delete{% endblock %}

{% block content %}
<div class="form-card">
  <div class="d-flex align-items-center gap-3 mb-3">
    <div style="width:48px;height:48px;border-radius:.5rem;background:#fef2f2;color:#dc2626;display:flex;align-items:center;justify-content:center;font-size:1.4rem;">
      <i class="bi bi-exclamation-triangle"></i>
    </div>
    <div>
      <h5 class="fw-semibold mb-0">Delete Record</h5>
      <small class="text-muted">This action cannot be undone.</small>
    </div>
  </div>

  <p class="text-muted">
    Are you sure you want to delete <strong>{{ object }}</strong>?
  </p>

  <form method="post">
    {% csrf_token %}
    <div class="d-flex gap-2 mt-3">
      <button type="submit" class="btn btn-danger px-4">
        <i class="bi bi-trash me-1"></i>Yes, delete
      </button>
      <a href="javascript:history.back()" class="btn btn-outline-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
