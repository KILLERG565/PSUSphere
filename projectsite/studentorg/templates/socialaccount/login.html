{% load i18n %}
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>Confirm {{ provider.name }} Login</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #003087 0%, #002070 100%);
    }
    .auth-card {
      max-width: 450px;
      width: 100%;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      padding: 2.5rem;
      text-align: center;
    }
    .auth-card h3 {
      color: #003087;
      margin-bottom: 1.5rem;
      font-weight: 700;
    }
    .auth-card p {
      color: #475569;
      margin-bottom: 1.5rem;
      line-height: 1.6;
    }
    .provider-icon {
      font-size: 2rem;
      margin: 0 0.5rem;
      display: inline-block;
    }
    .form-group {
      margin-bottom: 1rem;
    }
    .btn-continue {
      background: #003087;
      border: none;
      color: #fff;
      padding: 0.85rem 2rem;
      font-weight: 600;
      border-radius: 6px;
      width: 100%;
      margin-bottom: 0.75rem;
      transition: all 0.2s;
    }
    .btn-continue:hover {
      background: #002070;
      color: #fff;
      text-decoration: none;
    }
    .btn-cancel {
      background: transparent;
      border: 1px solid #e2e8f0;
      color: #475569;
      padding: 0.85rem 2rem;
      font-weight: 600;
      border-radius: 6px;
      width: 100%;
      transition: all 0.2s;
    }
    .btn-cancel:hover {
      background: #f8fafc;
      border-color: #cbd5e1;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="auth-card">
    <h3><i class="fas fa-graduation-cap"></i> PSUSphere</h3>
    <h4>Confirm Sign In</h4>
    <p>You are about to sign in using your <strong>{{ provider.name }}</strong> account.</p>

    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <button type="submit" class="btn btn-continue">
          <i class="fab fa-{{ provider.name|lower }}"></i> Continue with {{ provider.name }}
        </button>
      </div>
    </form>

    <a href="{% url 'account_login' %}" class="btn btn-cancel">
      <i class="fas fa-times"></i> Cancel
    </a>
  </div>
</body>
</html>
