{% load socialaccount %}
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>PSUSphere Login</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #003087 0%, #002070 100%);
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    .auth-card {
      max-width: 550px;
      width: 100%;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      padding: 2.5rem;
    }
    .auth-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .auth-header h2 {
      color: #003087;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }
    .auth-header p {
      color: #64748b;
      font-size: 0.95rem;
    }
    .form-outline {
      margin-bottom: 1.25rem;
    }
    .form-outline label {
      color: #475569;
      font-weight: 500;
      font-size: 0.9rem;
      margin-bottom: 0.5rem;
    }
    .form-control {
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 0.75rem 1rem;
      font-size: 0.95rem;
    }
    .form-control:focus {
      border-color: #003087;
      box-shadow: 0 0 0 3px rgba(0, 48, 135, 0.1);
    }
    .social-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .social-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.75rem;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      background: #fff;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
      color: #475569;
      font-size: 0.9rem;
      font-weight: 500;
    }
    .social-btn:hover {
      background: #f8fafc;
      border-color: #cbd5e1;
      color: #003087;
    }
    .social-btn i {
      font-size: 1.1rem;
    }
    .divider {
      display: flex;
      align-items: center;
      margin: 1.5rem 0;
      color: #94a3b8;
      font-size: 0.85rem;
    }
    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #e2e8f0;
    }
    .divider span {
      margin: 0 1rem;
    }
    .btn-login {
      background: #003087;
      border: none;
      color: #fff;
      padding: 0.85rem;
      font-weight: 600;
      border-radius: 6px;
      width: 100%;
      margin-bottom: 1rem;
      transition: all 0.2s;
    }
    .btn-login:hover {
      background: #002070;
      color: #fff;
    }
    .footer-link {
      text-align: center;
      margin-top: 1.5rem;
    }
    .footer-link a {
      color: #003087;
      text-decoration: none;
      font-weight: 500;
      font-size: 0.9rem;
    }
    .footer-link a:hover {
      text-decoration: underline;
    }
    .alert-danger {
      background: #fee2e2;
      border: 1px solid #fecaca;
      color: #991b1b;
      border-radius: 6px;
      padding: 1rem;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
    }
    .checkbox-group {
      display: flex;
      align-items: center;
      margin: 1rem 0;
    }
    .checkbox-group input {
      margin-right: 0.5rem;
    }
    .checkbox-group label {
      margin: 0;
      color: #475569;
      font-size: 0.9rem;
    }
    .tab-nav {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      border-bottom: 2px solid #e2e8f0;
    }
    .tab-nav button {
      padding: 0.75rem 1rem;
      border: none;
      background: transparent;
      cursor: pointer;
      color: #94a3b8;
      font-weight: 500;
      border-bottom: 3px solid transparent;
      margin-bottom: -2px;
      transition: all 0.2s;
    }
    .tab-nav button.active {
      color: #003087;
      border-bottom-color: #003087;
    }
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="auth-header">
      <h2><i class="fas fa-graduation-cap me-2"></i>PSUSphere</h2>
      <p>Pangasinan State University</p>
    </div>

    <div class="tab-nav">
      <button type="button" class="tab-btn active" data-tab="login">Sign In</button>
      <button type="button" class="tab-btn" data-tab="register">Sign Up</button>
    </div>

    <!-- Login Tab -->
    <div id="login" class="tab-content active">
      <form method="post" action="{% url 'account_login' %}">
        {% csrf_token %}

        {% if form.non_field_errors %}
          <div class="alert-danger">
            {% for error in form.non_field_errors %}
              <p{% if forloop.last %} class="mb-0"{% endif %}>{{ error }}</p>
            {% endfor %}
          </div>
        {% endif %}

        <div class="social-buttons">
          <a href="{% provider_login_url 'google' %}" class="social-btn">
            <i class="fab fa-google"></i> Google
          </a>
          <a href="{% provider_login_url 'github' %}" class="social-btn">
            <i class="fab fa-github"></i> GitHub
          </a>
        </div>

        <div class="divider"><span>OR</span></div>

        <div class="form-outline">
          <label for="id_login">Email or Username</label>
          <input type="text" name="login" id="id_login" class="form-control" required />
        </div>

        <div class="form-outline">
          <label for="id_password">Password</label>
          <input type="password" name="password" id="id_password" class="form-control" required />
        </div>

        <div class="checkbox-group">
          <input type="checkbox" id="rememberMe" name="remember" />
          <label for="rememberMe">Remember me</label>
        </div>

        <button type="submit" class="btn btn-login">Sign In</button>

        <div class="footer-link">
          <a href="{% url 'account_reset_password' %}">Forgot your password?</a>
        </div>
      </form>
    </div>

    <!-- Register Tab -->
    <div id="register" class="tab-content">
      <form method="post" action="{% url 'account_signup' %}">
        {% csrf_token %}

        <div class="social-buttons">
          <a href="{% provider_login_url 'google' %}" class="social-btn">
            <i class="fab fa-google"></i> Google
          </a>
          <a href="{% provider_login_url 'github' %}" class="social-btn">
            <i class="fab fa-github"></i> GitHub
          </a>
        </div>

        <div class="divider"><span>OR</span></div>

        <div class="form-outline">
          <label for="registerUsername">Username</label>
          <input type="text" name="username" id="registerUsername" class="form-control" required />
        </div>

        <div class="form-outline">
          <label for="registerEmail">Email</label>
          <input type="email" name="email" id="registerEmail" class="form-control" required />
        </div>

        <div class="form-outline">
          <label for="registerPassword">Password</label>
          <input type="password" name="password1" id="registerPassword" class="form-control" required />
        </div>

        <div class="form-outline">
          <label for="registerRepeatPassword">Confirm Password</label>
          <input type="password" name="password2" id="registerRepeatPassword" class="form-control" required />
        </div>

        <button type="submit" class="btn btn-login">Create Account</button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        const tabName = this.dataset.tab;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        this.classList.add('active');
        document.getElementById(tabName).classList.add('active');
      });
    });
  </script>
</body>
</html>
